<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Tito — جاري التعديل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ---------- RESET ---------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0c0c0c;
      --text: #f2f0ec;
      --muted: #8a8782;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #c8b89a;
      --font-display: 'Playfair Display', serif;
      --font-sans: 'DM Sans', sans-serif;
      --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- SUBTLE BACKGROUND GLOW ---------- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 20% 30%, rgba(200, 184, 154, 0.04), transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(200, 184, 154, 0.03), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---------- WRAPPER ---------- */
    .wait-wrapper {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
    }

    /* ---------- TOP LABEL ---------- */
    .wait-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.2s forwards;
    }

    /* ---------- CIRCULAR LOADER ---------- */
    .loader {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 3rem;
      opacity: 0;
      animation: fadeIn 1s var(--ease-out) 0.4s forwards;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
    }

    .loader-ring::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent);
      animation: spin 1.6s cubic-bezier(0.6, 0.15, 0.4, 0.85) infinite;
    }

    .loader-ring-2 {
      inset: 15px;
    }
    .loader-ring-2::after {
      border-top-color: transparent;
      border-right-color: transparent;
      border-bottom-color: var(--accent);
      border-left-color: var(--accent);
      animation-duration: 2.2s;
      animation-direction: reverse;
      opacity: 0.5;
    }

    /* Percentage counter */
    .loader-percent {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text);
      letter-spacing: 0.02em;
      animation: fadeIn 0.5s var(--ease-out);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- MAIN TEXT ---------- */
    .wait-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.6s forwards;
    }

    .wait-title .italic {
      font-style: italic;
      color: var(--accent);
    }

    .wait-sub {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.8s forwards;
    }

    /* ---------- ANIMATED DOTS ---------- */
    .wait-dots {
      display: inline-flex;
      gap: 0.5rem;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 1s forwards;
    }
    .wait-dots span {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotBounce 1.4s var(--ease-out) infinite;
    }
    .wait-dots span:nth-child(2) { animation-delay: 0.15s; }
    .wait-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotBounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.3;
      }
      30% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    /* ---------- PROGRESS LINE ---------- */
    .wait-progress {
      width: 100%;
      max-width: 320px;
      height: 1px;
      background: var(--border);
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 1s var(--ease-out) 1.2s forwards;
    }
    .wait-progress::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: var(--accent);
      animation: progressSlide 2.4s var(--ease-out) infinite;
    }

    @keyframes progressSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* ---------- FOOTER ---------- */
    .wait-footer {
      position: fixed;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeIn 1s var(--ease-out) 1.4s forwards;
    }
    .wait-footer .brand {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--text);
      letter-spacing: 0.05em;
      text-transform: none;
      display: block;
      margin-bottom: 0.4rem;
    }

    /* ---------- SHARED ANIMATIONS ---------- */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* ---------- MOBILE ---------- */
    @media (max-width: 576px) {
      .loader {
        width: 110px;
        height: 110px;
        margin-bottom: 2.5rem;
      }
      .loader-percent { font-size: 0.95rem; }
      .wait-label { margin-bottom: 2rem; }
      .wait-sub { margin-bottom: 2.5rem; }
    }
  </style>
</head>
<body>

  <div class="wait-wrapper">
    <div class="wait-label">Ahmed Tito — Portfolio</div>

    <h1 class="wait-title">
      جاري <span class="italic">التعديل</span>
    </h1>

    <p class="wait-sub">سيتم العودة قريباً</p>

    <div class="wait-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="wait-progress"></div>
  </div>

  <div class="wait-footer">
    <span class="brand">Ahmed Tito</span>
    Photographer / Visual Artist
  </div>

</body>
</html>
